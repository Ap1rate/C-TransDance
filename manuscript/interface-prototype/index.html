<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dance Scoring Terminal</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="terminal">
      <header class="topbar">
        <div>
          <h1>Dance Scoring Terminal</h1>
          <p id="sessionMeta">Ready · demo scoring scaffold · 30 fps target</p>
        </div>
        <div class="toolbar" aria-label="Session controls">
          <label class="select">
            <span>Style</span>
            <select id="styleSelect">
              <option>Contemporary</option>
              <option>Ballet</option>
              <option>Hip-hop</option>
              <option>Folk</option>
              <option>Jazz</option>
            </select>
          </label>
          <label class="select">
            <span>Source</span>
            <select id="sourceSelect">
              <option value="demo">Demo</option>
              <option value="camera">Camera</option>
            </select>
          </label>
          <button id="startBtn" type="button" title="Start session">Start</button>
          <button id="resetBtn" type="button" title="Reset session">Reset</button>
          <button id="exportBtn" type="button" title="Export report">Export</button>
        </div>
      </header>

      <section class="workspace" aria-label="Dance scoring workspace">
        <section class="stage">
          <div class="stageHeader">
            <strong>Video with skeleton overlay</strong>
            <span id="runState">Idle</span>
          </div>
          <div class="viewport">
            <video id="cameraFeed" playsinline muted></video>
            <canvas id="poseCanvas" width="960" height="540"></canvas>
            <svg class="poseSvg" viewBox="0 0 960 540" aria-hidden="true">
              <g class="poseFigure">
                <path class="trail" d="M300 250 C430 90 575 100 675 235" />
                <g class="bones">
                  <line x1="480" y1="110" x2="480" y2="160" />
                  <line x1="480" y1="160" x2="410" y2="175" />
                  <line x1="480" y1="160" x2="555" y2="178" />
                  <line x1="410" y1="175" x2="335" y2="230" />
                  <line x1="335" y1="230" x2="275" y2="290" />
                  <line x1="555" y1="178" x2="625" y2="225" />
                  <line x1="625" y1="225" x2="695" y2="180" />
                  <line x1="480" y1="160" x2="490" y2="305" />
                  <line x1="490" y1="305" x2="440" y2="315" />
                  <line x1="490" y1="305" x2="545" y2="315" />
                  <line x1="440" y1="315" x2="395" y2="420" />
                  <line x1="395" y1="420" x2="355" y2="505" />
                  <line x1="545" y1="315" x2="595" y2="410" />
                  <line x1="595" y1="410" x2="650" y2="495" />
                </g>
                <g class="joints">
                  <circle cx="480" cy="110" r="12" />
                  <circle cx="480" cy="160" r="11" />
                  <circle cx="410" cy="175" r="10" />
                  <circle cx="555" cy="178" r="10" />
                  <circle cx="335" cy="230" r="10" />
                  <circle cx="625" cy="225" r="10" />
                  <circle cx="275" cy="290" r="10" />
                  <circle cx="695" cy="180" r="10" />
                  <circle cx="490" cy="305" r="10" />
                  <circle cx="440" cy="315" r="10" />
                  <circle cx="545" cy="315" r="10" />
                  <circle class="warn" cx="395" cy="420" r="11" />
                  <circle class="warn" cx="355" cy="505" r="11" />
                  <circle class="mid" cx="595" cy="410" r="11" />
                  <circle class="warn" cx="650" cy="495" r="11" />
                </g>
              </g>
            </svg>
            <div id="demoBackdrop" class="demoBackdrop">
              <div class="floor"></div>
              <div class="mirrorLine"></div>
            </div>
          </div>
        </section>

        <aside class="metrics" aria-label="Assessment metrics">
          <div class="scoreGrid">
            <article class="scoreCard">
              <span>Overall score</span>
              <output id="overallScore">--</output>
            </article>
            <article class="scoreCard">
              <span>Quality level</span>
              <output id="qualityLevel">--</output>
            </article>
          </div>

          <article class="panel">
            <div class="panelTitle">
              <strong>Sub-score dimensions</strong>
              <span id="fpsText">30 fps target</span>
            </div>
            <div id="subscores" class="subscores"></div>
          </article>

          <article class="panel">
            <div class="panelTitle">
              <strong>Feedback categories</strong>
              <span id="frameText">Frame 0</span>
            </div>
            <div id="feedbackList" class="feedbackList"></div>
          </article>
        </aside>
      </section>

      <section class="timelinePanel" aria-label="Key frame timeline">
        <div class="timelineTop">
          <strong>Key frames</strong>
          <span id="timeText">00:00</span>
        </div>
        <div id="timeline" class="timeline"></div>
      </section>

      <section class="review" aria-label="Session review">
        <article class="panel compact">
          <strong>Explainable cues</strong>
          <div id="cueList" class="cueList"></div>
        </article>
        <article class="panel compact">
          <strong>Session log</strong>
          <ol id="sessionLog" class="sessionLog"></ol>
        </article>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
